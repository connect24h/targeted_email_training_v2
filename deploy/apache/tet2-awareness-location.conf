# SecurityAwarenessからの人物同期APIだけは、TET2管理画面のBasic認証対象外にする。
# API本体が十分に長いBearer tokenとserver固定tenantで認証する。
<Location "/tet2/api/integrations/awareness_targets.php">
    AuthType None
    Require all granted
</Location>

# root:root 600で配置し、version管理しない。
IncludeOptional /etc/apache2/tet2-awareness-secret.conf
