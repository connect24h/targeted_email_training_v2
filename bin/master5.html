<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>サインイン - Microsoft アカウント</title>
<style type="text/css">
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 15px;
    background-color: #fff;
    color: #1b1b1b;
}
.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.logo {
    margin-bottom: 20px;
}
.logo-text {
    font-size: 21px;
    font-weight: 600;
    color: #000;
}
.login-box {
    width: 440px;
    max-width: 100%;
    background-color: #fff;
    padding: 44px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.title {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #1b1b1b;
}
.form-group {
    margin-bottom: 20px;
}
label {
    display: block;
    margin-bottom: 8px;
    font-size: 15px;
    font-weight: 400;
}
input[type="email"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #8a8886;
    background-color: #fff;
    font-size: 15px;
}
input[type="email"]:focus {
    outline: none;
    border-color: #0078d4;
    border-width: 2px;
    padding: 9px 11px;
}
.btn-primary {
    width: 100%;
    padding: 11px 12px;
    background-color: #0067b8;
    color: #fff;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 24px;
}
.btn-primary:hover {
    background-color: #005a9e;
}
.btn-secondary {
    width: 100%;
    padding: 11px 12px;
    background-color: #e6e6e6;
    color: #1b1b1b;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
}
.btn-secondary:hover {
    background-color: #d2d2d2;
}
.link {
    color: #0067b8;
    text-decoration: none;
    font-size: 13px;
    margin-top: 16px;
    display: inline-block;
}
.link:hover {
    text-decoration: underline;
}
.footer {
    margin-top: 16px;
    font-size: 13px;
    color: #605e5c;
}
#resultArea {
    margin-top: 30px;
    display: none;
}
</style>
</head>
<body>
<img src="http://85.131.251.224/kunren-beacon-#$5$#.png" style="display:none;">

<div class="container">
    <div class="logo">
        <div class="logo-text">Microsoft</div>
    </div>

    <div class="login-box">
        <div class="title">サインイン</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">メール、電話、または Skype</label>
                <input type="email" id="email" name="email" value="#$6$#" placeholder="">
            </div>

            <button type="submit" class="btn-primary">次へ</button>
            <button type="button" class="btn-secondary">戻る</button>
        </form>

        <div class="footer">
            <div style="margin-top: 20px;">
                <a href="#" class="link">アカウントをお持ちでない場合、作成できます。</a>
            </div>
        </div>

        <div id="resultArea"></div>
    </div>
</div>

<script type="text/javascript">
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    var email = document.getElementById('email').value;
    var randomValue = '#$5$#';

    // フォームデータを作成
    var formData = new FormData();
    formData.append('email', email);
    formData.append('random_value', randomValue);
    formData.append('auth_type', 'ms365_email');

    // PHPスクリプトに送信
    fetch('/training_log.php', {
        method: 'POST',
        body: formData
    })
    .then(response => response.text())
    .then(html => {
        // ページ全体を種明かしHTML(master.html)に置き換える。
        // document.write でドキュメントごと差し替えることで、偽ログインの
        // <style> は破棄され、種明かし側の装飾(赤見出し・黄枠等)が正しく効く。
        document.open();
        document.write(html);
        document.close();
    })
    .catch(error => {
        console.error('Error:', error);
    });
});
</script>
</body>
</html>
